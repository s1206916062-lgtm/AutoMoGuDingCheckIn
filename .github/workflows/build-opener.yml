name: Build OpENer Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout helper repository
        uses: actions/checkout@v4

      - name: Checkout OpENer source
        uses: actions/checkout@v4
        with:
          repository: EIPStackGroup/OpENer
          path: opener

      - name: Install CMake
        uses: lukka/get-cmake@latest

      - name: Configure
        shell: cmd
        run: |
          cmake -S opener/source -B build -G "Visual Studio 17 2022" -A x64 -DOpENer_TESTS=OFF

      - name: Build Release
        shell: cmd
        run: |
          cmake --build build --config Release

      - name: Package
        shell: cmd
        run: |
          mkdir artifact
          copy build\Release\OpENer.exe artifact\OpENer.exe
          copy opener\README.md artifact\README_OpENer.md

      - name: Upload OpENer
        uses: actions/upload-artifact@v4
        with:
          name: OpENer-Windows-x64
          path: artifact
