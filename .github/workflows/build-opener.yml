name: Build OpENer Windows x64

on:
  push:
    branches:
      - opener-build-temp
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Build official OpENer without external actions
        shell: pwsh
        env:
          REPOSITORY: ${{ github.repository }}
          BRANCH: opener-build-temp
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $authenticatedRepo = "https://x-access-token:$env:GH_TOKEN@github.com/$env:REPOSITORY.git"

          git clone --branch $env:BRANCH --single-branch $authenticatedRepo helper
          Set-Location helper
          git clone --branch master --depth 1 https://github.com/EIPStackGroup/OpENer.git opener

          $outputDir = Join-Path $PWD 'opener-build-output'
          $packageDir = Join-Path $PWD 'opener-package'
          $logFile = Join-Path $outputDir 'build.log'
          $statusFile = Join-Path $outputDir 'BUILD_STATUS.txt'

          Remove-Item $outputDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item $packageDir -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item build -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null

          function Run-Native {
            param(
              [Parameter(Mandatory = $true)][string]$Command,
              [Parameter(Mandatory = $true)][string[]]$Arguments
            )
            "`n> $Command $($Arguments -join ' ')" | Tee-Object -FilePath $logFile -Append
            & $Command @Arguments 2>&1 | Tee-Object -FilePath $logFile -Append
            if ($LASTEXITCODE -ne 0) {
              throw "$Command failed with exit code $LASTEXITCODE"
            }
          }

          try {
            Run-Native 'cmake' @('--version')
            Run-Native 'git' @('--version')
            $sourceCommit = (& git -C opener rev-parse HEAD).Trim()

            Run-Native 'cmake' @(
              '-S', 'opener/source',
              '-B', 'build',
              '-G', 'Visual Studio 18 2026',
              '-A', 'x64',
              '-DOpENer_PLATFORM=WIN32',
              '-DOpENer_TESTS=OFF',
              '-DOpENer_TRACES=ON'
            )

            Run-Native 'cmake' @('--build', 'build', '--config', 'Release', '--parallel')

            $exe = Get-ChildItem -Path build -Filter OpENer.exe -Recurse | Select-Object -First 1
            if (-not $exe) {
              throw 'OpENer.exe was not found after the build.'
            }

            Copy-Item $exe.FullName (Join-Path $packageDir 'OpENer.exe')
            Copy-Item opener/README.md (Join-Path $packageDir 'README_OpENer.md')
            Copy-Item opener/LICENSE (Join-Path $packageDir 'LICENSE.txt') -ErrorAction SilentlyContinue

            @"
          Official source: https://github.com/EIPStackGroup/OpENer
          Source branch: master
          Source commit: $sourceCommit
          Build platform: WIN32 x64
          Build configuration: Release
          Generator: Visual Studio 18 2026

          Run from Command Prompt:
            OpENer.exe <local IPv4 address>

          Example:
            OpENer.exe 192.168.10.30

          Windows Firewall may need rules for:
            TCP 44818
            UDP 44818
            UDP 2222
          "@ | Set-Content -Path (Join-Path $packageDir 'BUILD_INFO.txt') -Encoding UTF8

            Get-FileHash (Join-Path $packageDir 'OpENer.exe') -Algorithm SHA256 |
              ForEach-Object { "$($_.Hash)  OpENer.exe" } |
              Set-Content (Join-Path $packageDir 'SHA256SUMS.txt') -Encoding ASCII

            Compress-Archive -Path (Join-Path $packageDir '*') `
              -DestinationPath (Join-Path $outputDir 'OpENer-Windows-x64.zip') `
              -CompressionLevel Optimal -Force

            "SUCCESS`nSource commit: $sourceCommit`nGenerated: $(Get-Date -Format o)" |
              Set-Content $statusFile -Encoding UTF8
          }
          catch {
            "FAILED`n$($_.Exception.Message)`nGenerated: $(Get-Date -Format o)" |
              Set-Content $statusFile -Encoding UTF8
            $_ | Out-String | Tee-Object -FilePath $logFile -Append
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add opener-build-output
          if (-not (git diff --cached --quiet)) {
            git commit -m "Store OpENer Windows build output [skip ci]"
            git push origin HEAD:$env:BRANCH
          }

          $status = Get-Content $statusFile -Raw
          Write-Host $status
          if (-not $status.StartsWith('SUCCESS')) {
            exit 1
          }
